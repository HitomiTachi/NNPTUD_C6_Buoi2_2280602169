<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="main.js">
    </script>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ccc;
        }
        .section h2 {
            margin-top: 0;
        }
        input[type="text"] {
            margin: 5px;
            padding: 5px;
        }
        input[type="submit"] {
            margin: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- POSTS SECTION -->
    <div class="section">
        <h2>Quản lý Posts</h2>
        <table id="post-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Views</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="post-body">
                
            </tbody>
        </table>
        <div>
            <h3>Thêm/Sửa Post</h3>
            <div>
                <label>ID (để trống để tự động tăng):</label>
                <input type="text" id="id_txt" placeholder="ID">
            </div>
            <div>
                <label>Title:</label>
                <input type="text" id="title_txt" placeholder="Title">
            </div>
            <div>
                <label>Views:</label>
                <input type="text" id="views_txt" placeholder="Views">
            </div>
            <div>
                <input type="submit" value="Save" onclick="saveData()">
            </div>
        </div>
    </div>

    <!-- COMMENTS SECTION -->
    <div class="section">
        <h2>Quản lý Comments</h2>
        <table id="comment-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Text</th>
                    <th>Post ID</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="comment-body">
                
            </tbody>
        </table>
        <div>
            <h3>Thêm/Sửa Comment</h3>
            <div>
                <label>ID (để trống để tự động tăng):</label>
                <input type="text" id="comment_id_txt" placeholder="ID">
            </div>
            <div>
                <label>Text:</label>
                <input type="text" id="comment_text_txt" placeholder="Comment text">
            </div>
            <div>
                <label>Post ID:</label>
                <input type="text" id="comment_postId_txt" placeholder="Post ID">
            </div>
            <div>
                <input type="submit" value="Save Comment" onclick="saveComment()">
            </div>
        </div>
    </div>
</body>
</html>
